version: '3.8'

services:
  web:
    build: .
    container_name: proyecciones_web
    ports:
      - "${PORT:-5077}:5000"  # Acceso web vía http://IP_VPS:${PORT}
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:proyecciones_secret_2026@db:5432/proyecciones}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
    env_file:
      - .env
    volumes:
      - ./siembras_podas:/app/siembras_podas
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: proyecciones_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-proyecciones}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-proyecciones_secret_2026}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # En producción, PostgreSQL NO expone puertos a internet por seguridad (solo comunicación interna de la red de Docker)
    # ports:
    #   - "5477:5432"
    restart: always

  # Servicio Adminer desactivado por seguridad en producción (descomentar solo para mantenimiento)
  # adminer:
  #   image: adminer
  #   container_name: proyecciones_adminer
  #   ports:
  #     - "8099:8080"
  #   restart: always

volumes:
  postgres_data:
